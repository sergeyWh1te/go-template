---
name: checks

on:
  pull_request:
  push:
    branches:
      - main

# Action versions are pinned to majors that run on Node 24; Node 20 is
# deprecated on GitHub runners.
#
# The jobs below all set `cache: true` and start in parallel, so they share one
# cache key (derived from go.sum) and race to save it. The losers log
# "Failed to save: Unable to reserve cache ... another job may be creating this
# cache" — that is expected and harmless: one job stores the entry and the rest
# reuse it on the next run.

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.7.0

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Install golangci-lint
        run: |
          GOBIN=$PWD/bin go install \
            github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Check formatting
        run: make check-format

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Install golangci-lint
        run: |
          GOBIN=$PWD/bin go install \
            github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Run linters
        run: make lint

  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Install govulncheck
        run: |
          GOBIN=$PWD/bin go install \
            golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Run govulncheck
        run: make vulncheck

  test:
    name: Test
    runs-on: ubuntu-24.04
    # Don't spend runner time on a tree with known vulnerable dependencies.
    needs: vulncheck
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: master
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Build
        run: make build

      # make cover runs the same tests as test-integration (TEST_PG_DSN set,
      # so the database-backed tests must actually run, never silently skip)
      # and fails when total coverage drops below COVER_MIN in the Makefile.
      - name: Run tests with coverage
        run: make cover
        env:
          TEST_PG_DSN: postgres://postgres:postgres@127.0.0.1:5432/master?sslmode=disable

      # always(): the total is most useful exactly when the threshold failed.
      - name: Write coverage summary
        if: always() && hashFiles('coverage.out') != ''
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { print $3 }')
          {
            echo "### Coverage"
            echo
            echo "Total statement coverage: **${total}**"
            echo
            echo "<details><summary>Per function</summary>"
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        if: always() && hashFiles('coverage.out') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    # Catch a broken Dockerfile here instead of at deploy time. The image is
    # built but never pushed.
    # The service pings Postgres at startup and exits without it, so the smoke
    # test below needs a database too.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: master
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.1

      - name: Setup buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          load: true
          build-args: |
            COMMIT=${{ github.sha }}
          tags: go-template:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the binary is in the image
        run: docker run --rm --entrypoint ls go-template:ci -l /app/service

      # --network host: the Postgres service container is published on the
      # runner's 127.0.0.1:5432. READ_ENV_FROM_SHELL because the image has no .env.
      - name: Smoke-test /health
        run: |
          docker run -d --name smoke --network host \
            -e READ_ENV_FROM_SHELL=true \
            -e APP_NAME=go_template -e ENV=ci -e PORT=8080 -e LOG_FORMAT=json -e LOG_LEVEL=info \
            -e PG_HOST=127.0.0.1 -e PG_PORT=5432 -e PG_USERNAME=postgres -e PG_PASSWORD=postgres \
            -e PG_DATABASE=master -e PG_SCHEMA=public -e PG_SSLMODE=disable \
            go-template:ci
          for _ in $(seq 1 30); do
            if body=$(curl -fsS http://127.0.0.1:8080/health); then
              echo "$body"
              test "$body" = '{"status":"ok"}'
              exit 0
            fi
            sleep 1
          done
          echo "service did not answer /health in 30s"
          docker logs smoke
          exit 1

      - name: Container logs
        if: always()
        run: docker logs smoke || true
