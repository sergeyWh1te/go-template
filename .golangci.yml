version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - dogsled
    - dupl
    - errcheck
    - funlen
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace


  settings:
    depguard:
      rules:
        logger:
          files:
            - "!**/internal/connectors/logger/**"
            - "!**/internal/utils/deps/**"
            - "!**/internal/app/**"
          deny:
            - pkg: "github.com/sirupsen/logrus"
              desc: "use the injected Logger interface from internal/utils/deps instead of importing logrus directly"
    dupl:
      threshold: 100
    funlen:
      lines: -1
      statements: 50
    goconst:
      min-len: 2
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
    gocyclo:
      min-complexity: 15
    govet:
      enable:
        - shadow
    lll:
      line-length: 140
    misspell:
      locale: US
    mnd:
      checks:
        - argument
        - case
        - condition
        - return
      ignored-numbers:
        - '0'
        - '1'
        - '2'
        - '3'
      ignored-functions:
        - strings.SplitN
    nolintlint:
      allow-unused: false
      require-explanation: false
      require-specific: false
    revive:
      rules:
        - name: unexported-return
          disabled: true
        - name: unused-parameter

  exclusions:
    paths:
      - mocks
    rules:
      - path: _test\.go
        linters:
          - mnd

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    gofmt:
      rewrite-rules:
        - pattern: 'interface{}'
          replacement: 'any'
    goimports:
      local-prefixes:
        - github.com/sergeyWh1te/go-template
